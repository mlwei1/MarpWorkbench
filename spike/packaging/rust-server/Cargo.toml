[package]
name = "marp-lite-server"
version = "0.1.0"
edition = "2021"
description = "Minimal single-file HTTP server: axum + rust-embed, serves an embedded Marp-style deck and opens the default browser"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rust-embed = "8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
